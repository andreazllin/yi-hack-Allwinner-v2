# Fork release: builds the firmware image with the frontend baked in and
# publishes it, on every push to the default branch.
#
# Version scheme: <upstream VERSION>_<short hash>, e.g. 0.3.6_2b904a0.
# The underscore is what distinguishes a fork release from an upstream
# untagged build, which pack_fw.sh already labels 0.3.6-<hash> with a hyphen.
#
# VERSION is upstream's file and is NEVER edited in the repo — that would
# conflict on every upstream version bump. It is rewritten in the working tree
# at build time only, which is enough because pack_fw.sh reads it with
# `cat VERSION`.
#
# The frontend itself is baked in by src/zz-frontend/, a build module that
# scripts/compile.sh picks up automatically (it loops over src/*), so no
# upstream file is modified anywhere in this pipeline. That module also
# relocates the stock UI to /panel/, which is why the frontend ends up at the
# document root.
#
# Filename carries the `frontend-` prefix per the fork's convention, so it can
# never collide with an upstream workflow.
name: frontend-release

on:
  push:
    branches:
      - master

# A second push must not race the first into the same tag.
concurrency:
  group: frontend-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  SUNXI_TOOLCHAIN: /opt/yi/toolchain-sunxi-musl

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # pack_fw.sh inspects tags, so the full history is needed.
          fetch-depth: 0

      - name: Compute the fork version
        id: version
        run: |
          BASE=$(cat VERSION)
          HASH=$(git rev-parse --short HEAD)
          VER="${BASE}_${HASH}"
          echo "base=$BASE"   >> "$GITHUB_OUTPUT"
          echo "ver=$VER"     >> "$GITHUB_OUTPUT"
          echo "Releasing $VER (upstream base $BASE)"

      - name: Stop if this version was already released
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.ver }}" >/dev/null; then
            echo "::notice::Tag ${{ steps.version.outputs.ver }} already exists - nothing to do."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y git unzip build-essential \
            bison bisonc++ libbison-dev autoconf autotools-dev \
            automake libssl-dev zlib1g-dev libzzip-dev flex libfl-dev \
            yui-compressor closure-compiler optipng jpegoptim libtidy5deb1 node-less \
            sassc sass-spec libhtml-tidy-perl libxml2-utils rsync qemu-user-static

      - name: Download toolchain
        run: |
          git clone https://github.com/lindenis-org/lindenis-v536-prebuilt
          sudo mkdir -p ${SUNXI_TOOLCHAIN}
          sudo cp -r lindenis-v536-prebuilt/gcc/linux-x86/arm/toolchain-sunxi-musl/toolchain ${SUNXI_TOOLCHAIN}/

      # Written before packing, and left uncommitted: pack_fw.sh reads VERSION
      # with `cat`, and only treats the build as an official release when a tag
      # on HEAD exactly equals that string. Both halves have to line up or the
      # image ends up labelled 0.3.6_<hash>-<hash>.
      - name: Set the build version
        run: |
          echo -n "${{ steps.version.outputs.ver }}" > VERSION
          git tag "${{ steps.version.outputs.ver }}"

      - name: Build
        # GITHUB_REPOSITORY points the over-the-air updater at this fork
        # (src/zz-fork-overrides). Without it a released image would check
        # upstream for updates and replace itself.
        run: bash -ex scripts/compile.sh

      - name: Pack
        run: sudo bash -ex scripts/pack_fw.all.sh

      - name: Confirm the updater points at this fork
        run: |
          # An image that still checks upstream would offer an "upgrade" that
          # overwrites this fork, so this must never ship wrong.
          FW=build/yi-hack/www/cgi-bin/fw_upgrade.sh
          if grep -q "roleoroleo/yi-hack-Allwinner-v2" "$FW"; then
            echo "::error::$FW still points at upstream."
            exit 1
          fi
          if ! grep -q "${GITHUB_REPOSITORY}/releases" "$FW"; then
            echo "::error::$FW does not reference ${GITHUB_REPOSITORY} releases."
            exit 1
          fi
          echo "updater points at ${GITHUB_REPOSITORY}"

      - name: Confirm the frontend is in the image
        run: |
          # A release whose whole purpose is the frontend must not ship without it.
          # The frontend is the document root now, and the stock UI must still
          # be reachable at /panel/ as the fallback when the frontend misbehaves.
          if ! ls build/yi-hack/www/index.html.gz >/dev/null 2>&1; then
            echo "::error::build/yi-hack/www/index.html.gz missing - the frontend is not at the document root."
            exit 1
          fi
          if ! ls build/yi-hack/www/panel/index.html.gz >/dev/null 2>&1; then
            echo "::error::build/yi-hack/www/panel/index.html.gz missing - the stock UI fallback was lost."
            exit 1
          fi
          # The Pages demo (frontend-pages.yml) bundles a mock camera behind a
          # Service Worker. In firmware that worker would sit between the UI
          # and the real camera and answer every request itself, so it must
          # never be in this image.
          if ls build/yi-hack/www/mockServiceWorker.js* >/dev/null 2>&1; then
            echo "::error::mockServiceWorker.js is in the image - the demo build was packed instead of the firmware build."
            exit 1
          fi
          for F in $(find build/yi-hack/www -maxdepth 2 -name 'index-*.js.gz'); do
            if gunzip -c "$F" | grep -q "mockServiceWorker"; then
              echo "::error::$F references mockServiceWorker - the mock leaked into the firmware bundle."
              exit 1
            fi
          done
          # busybox only executes CGI at /cgi-bin/, so a relative reference
          # left in the relocated stock UI would be served as source instead.
          for F in $(find build/yi-hack/www/panel -name '*.js.gz'); do
            if gunzip -c "$F" | grep -qE "['\"]cgi-bin/"; then
              echo "::error::$F still has a relative cgi-bin/ reference; the stock UI would be broken at /panel/."
              exit 1
            fi
          done
          echo "frontend at /: $(find build/yi-hack/www -maxdepth 1 -type f | wc -l) files; stock UI at /panel/: $(find build/yi-hack/www/panel -type f | wc -l) files"

      - name: Check the version label landed
        run: |
          # Catches the VERSION/tag mismatch described above, which would
          # otherwise ship silently with a doubled hash.
          if ! ls out/*/*_${{ steps.version.outputs.ver }}.tgz >/dev/null 2>&1; then
            echo "::error::no artifact named *_${{ steps.version.outputs.ver }}.tgz - version labelling is wrong."
            ls -R out || true
            exit 1
          fi
          ls out/*/*.tgz

      # Pushed only now, so a failed build does not leave a tag behind.
      - name: Push the tag
        run: git push origin "${{ steps.version.outputs.ver }}"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.ver }}
          name: ${{ steps.version.outputs.ver }}
          files: out/**/*.tgz
          body: |
            Fork build of upstream **${{ steps.version.outputs.base }}** with the
            replacement frontend UI baked in, from commit ${{ github.sha }}.

            The frontend is the camera's default UI, served at `http://<camera>/`.
            The stock UI moves to `http://<camera>/panel/` and remains the
            fallback if the frontend misbehaves.

            Migrating from upstream's firmware? The camera's own updater cannot
            make that jump — see `docs/MIGRATION.md`.

            Untested against hardware by CI — it builds the image, it does not
            flash one.
