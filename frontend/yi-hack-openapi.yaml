openapi: 3.0.3
info:
  title: yi-hack-Allwinner-v2 Camera CGI API
  version: "1.0.0"
  description: |-
    HTTP CGI API implemented by the BusyBox httpd shell scripts under
    `/tmp/sd/yi-hack/www/cgi-bin/` on a yi-hack-Allwinner-v2 camera.

    FOUR FACTS THAT BREAK NAIVE CLIENTS - read these first:

    1. EVERY FAILURE IS HTTP 200. The scripts `exit 0` on every code path, so a
       rejected or failed request is still HTTP 200. You MUST inspect the body:
       a failure is the JSON object `{"error":"true"}`. There are no 4xx/5xx
       responses generated by the scripts. (The only non-200 is a 401 emitted by
       BusyBox httpd itself when HTTP Basic auth is enabled - see below.)

    2. `error` AND yes/no VALUES ARE STRINGS, NOT BOOLEANS. The scripts print
       `"error":"true"` / `"error":"false"` with literal quotes, so the value is
       the JSON string `"true"` / `"false"`, never a JSON boolean. Config values
       are likewise the strings `"yes"` / `"no"`; the firmware does NOT recognise
       `true`, `1`, or `on`. (One documented exception: `fw_upgrade.sh?get=info`
       emits `local_fw` as a BARE JSON boolean.)

    3. INVALID PARAMETER VALUES SUCCEED SILENTLY WITH NO EFFECT. Most enum-style
       params are matched with no `else` branch, so an out-of-domain value runs no
       command yet the request still returns `{"error":"false"}`. Do not treat a
       success response as confirmation that your value was applied.

    4. GET MUTATES. The firmware implements mutating operations (reboot, factory
       reset, delete recordings, PTZ motor moves, saving settings, firmware
       upgrade) as HTTP GET. NEVER prefetch, crawl, speculatively fetch, or send
       HEAD/GET probes against these endpoints - a crawler can reboot the camera,
       wipe recordings, or move the lens. Treat every GET here as potentially
       destructive.

    Additional behavioral notes:
    - Input validation is a set of character BLOCKLISTS (validate.sh), not
      allowlists. Several endpoints pass unquoted values into shell commands and
      are vulnerable to path traversal / argument splitting; those are documented
      per operation but not modelled as separate responses.
    - Many responses are assembled by hand with printf and can be malformed JSON
      (trailing commas, unescaped quotes, missing separators). Parse defensively.
    - `get_configs.sh` responses always end with a fake `"NULL":"NULL"` sentinel
      pair that clients must strip.
  contact:
    name: yi-hack-Allwinner-v2
    url: https://github.com/roleoroleo/yi-hack-Allwinner-v2
servers:
  - url: /
    description: The camera itself (frontend is served same-origin)
security:
  - {}
  - basicAuth: []
tags:
  - name: Status
    description: Read-only device telemetry and stream/snapshot link discovery.
  - name: Camera
    description: Live camera feature toggles applied via ipc_cmd hardware calls.
  - name: Configs
    description: Read and write the raw key=value .conf files under etc/.
  - name: Events
    description: List and delete motion-event recording directories and files.
  - name: Media
    description: Snapshots, on-demand recording, last-video retrieval, timelapse.
  - name: PTZ
    description: Pan/tilt/zoom motor control and preset management.
  - name: Audio
    description: Text-to-speech and audio playback through the camera speaker.
  - name: Network
    description: Wi-Fi scan/save and outbound connectivity/proxy testing.
  - name: Maintenance
    description: Reboot, factory reset, config backup/restore, firmware, services.

paths:
  /cgi-bin/camera_settings.sh:
    get:
      operationId: setCameraSettings
      tags:
        - Camera
      summary: Apply camera feature settings (mutating GET)
      description: |-
        Applies camera settings by issuing ipc_cmd hardware calls per recognised
        parameter. Despite being a GET this MUTATES device state.

        Behavioral facts:
        - At most 15 query parameters are parsed (`for I in 1 2 ... 15`); a 16th
          param is silently discarded. The stock UI sends exactly 15.
        - Binary params (switch_on, save_video_on_motion, face_detection,
          motion_tracking, sound_detection, led, ir, rotate, and the ai_*
          detections) are NOT strict yes/no: only the exact value `no` means OFF;
          ANY other value (including `yes`, `foo`, empty) means ON.
        - True enum params (motion_detection, sensitivity, sound_sensitivity,
          cruise) have NO else branch: an out-of-domain value is silently dropped
          (no command run) yet the request still returns `{"error":"false"}`.
        - Omitting a param issues no command for it (leaves current state).
        - ai_vehicle_detection and ai_animal_detection are only honoured on 11/12
          firmware AND only when motion_detection=no; otherwise ignored.
        - Every parameter name and value is run through validateString, which
          REJECTS any of `' ! " @ # $ % & ^ * ( ) . , : ;` (note `.` and `&` are
          rejected). A rejected value returns `{"error":"true"}`.
        - Worst-case latency ~9 seconds: an unconditional `sleep 0.5` runs on each
          of up to 15 loop iterations (~7.5s), plus `sleep 1` when switch_on=no,
          plus `sleep 0.5` when cruise is presets or 360.
      parameters:
        - name: switch_on
          in: query
          required: false
          description: Only `no` powers the camera off (also runs ipc_cmd -T); any other value powers it on.
          schema:
            type: string
        - name: save_video_on_motion
          in: query
          required: false
          description: Only `no` maps to `always`; any other value maps to `detect`.
          schema:
            type: string
        - name: motion_detection
          in: query
          required: false
          description: Enum yes/no. Any other value is silently dropped (keeps camera.conf default). Consumed only on 11/12 firmware.
          schema:
            $ref: '#/components/schemas/YesNo'
        - name: sensitivity
          in: query
          required: false
          description: Enum. Any other value is silently dropped (no command run) but still returns error=false.
          schema:
            type: string
            enum:
              - low
              - medium
              - high
        - name: ai_human_detection
          in: query
          required: false
          description: |-
            Only `no` means off; any other value means on. On 11/12 firmware it is
            applied only when motion_detection=no; when motion_detection != no it is
            silently ignored. On non-11/12 firmware it is always applied (via
            ipc_cmd -a), unlike vehicle/animal which are never applied there.
          schema:
            type: string
        - name: ai_vehicle_detection
          in: query
          required: false
          description: Only `no` means off; any other value means on. Ignored unless 11/12 firmware AND motion_detection=no.
          schema:
            type: string
        - name: ai_animal_detection
          in: query
          required: false
          description: Only `no` means off; any other value means on. Ignored unless 11/12 firmware AND motion_detection=no.
          schema:
            type: string
        - name: face_detection
          in: query
          required: false
          description: Only `no` means off; any other value means on.
          schema:
            type: string
        - name: motion_tracking
          in: query
          required: false
          description: Only `no` means off; any other value means on.
          schema:
            type: string
        - name: sound_detection
          in: query
          required: false
          description: Only `no` means off; any other value means on.
          schema:
            type: string
        - name: sound_sensitivity
          in: query
          required: false
          description: Exact-string enum. Note the gap - 55/65/75/85 are NOT accepted. Any other value is silently dropped.
          schema:
            type: string
            enum:
              - "30"
              - "35"
              - "40"
              - "45"
              - "50"
              - "60"
              - "70"
              - "80"
              - "90"
        - name: led
          in: query
          required: false
          description: Only `no` means off; any other value means on.
          schema:
            type: string
        - name: ir
          in: query
          required: false
          description: Only `no` means off; any other value means on.
          schema:
            type: string
        - name: rotate
          in: query
          required: false
          description: Only `no` means off; any other value means on.
          schema:
            type: string
        - name: cruise
          in: query
          required: false
          description: Enum. Any other value is silently dropped. `presets` and `360` add a 0.5s sleep.
          schema:
            type: string
            enum:
              - "no"
              - presets
              - "360"
      responses:
        "200":
          description: Always returned (success or validation failure). Check the error field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/get_configs.sh:
    get:
      operationId: getConfigs
      tags:
        - Configs
      summary: Read a .conf file as JSON
      description: |-
        Returns the raw `KEY=VALUE` contents of a chosen `.conf` file as a JSON
        object of string values.

        Behavioral facts:
        - The `conf` value selects the file `etc/<conf>.conf`, EXCEPT `mqtt` which
          is remapped to `etc/mqttv4.conf`. There is NO real enum in the script:
          any value that clears the validateQueryString blocklist is accepted and
          interpolated straight into the file path (so `.` and `/` enable path
          traversal reads). The enum below is the set of values the firmware and
          stock UI actually use; other values simply read a different / missing
          file.
        - A conf value pointing at a missing file is NOT an error: you get HTTP
          200 with a body of just `{"NULL":"NULL"}`.
        - EVERY response ends with a fake `"NULL":"NULL"` pair whose only purpose
          is to absorb the trailing comma left by the sed transform. Clients MUST
          ignore/strip the NULL key.
        - `conf` must be the ONLY query parameter: the script does `cut -d'='` on
          the whole QUERY_STRING and does not split on `&`, so `conf=camera&x=y`
          becomes the value `camera&x` and breaks the lookup.
        - Special output: `conf=system` also appends HOSTNAME; `conf=camera` also
          appends HOMEVER (injected RAW/unescaped); `conf=proxychains` returns a
          single PROXYCHAINS_SERVERS string built from the [ProxyList] section.
        - Values are only partially escaped; a stray quote/backslash can yield
          malformed JSON. Parse defensively.

        The generic response is modelled as an open string map. Named component
        schemas (CameraConf, SystemConf, MqttConf, MqttAdvertiseConf,
        PtzPresetsConf, ProxychainsConf) document the well-known files but cannot
        be referenced here because OpenAPI 3.0 cannot switch a response schema on
        a query-param value.
      parameters:
        - name: conf
          in: query
          required: false
          description: |-
            Config file to read. Known/meaningful values only; the script accepts
            any value (blocklist, not allowlist). `mqtt` reads mqttv4.conf.
          schema:
            type: string
            enum:
              - camera
              - system
              - mqtt
              - mqtt_advertise
              - proxychains
              - ptz_presets
      responses:
        "200":
          description: |-
            Always returned. A validation failure is `{"error":"true"}`; a missing
            file is `{"NULL":"NULL"}`; otherwise the conf contents plus the trailing
            NULL sentinel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConfigsResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/set_configs.sh:
    post:
      operationId: setConfigs
      tags:
        - Configs
      summary: Write keys into a .conf file
      description: |-
        Writes keys into the `.conf` file selected by the `conf` query parameter.

        Behavioral facts:
        - Body is a single line of JSON (read via `read -r`, first line only) that
          must be a valid JSON object (checked by `jq -e`). The stock UI sends a
          one-line `JSON.stringify` object, so this works; a genuinely multi-line
          body would be truncated.
        - Interpreted as a flat map KEY -> value. Each KEY is checked by validateKey
          (rejects `| \ / ' ! " @ # $ % & ^ * ( ) . , : ; { } = ?`); a bad KEY
          returns `{"error":"true"}`. VALUES are generally NOT validated.
        - Generic keys are written with `sed -i` only if a `^KEY=` line ALREADY
          exists in the target file; unknown keys are accepted (error=false) but
          write nothing.
        - Special keys: HOSTNAME (also runs `hostname`, derives yi-<mac>/yi-hack
          when empty), MOTION_IMAGE_DELAY (only written if numeric AND <= 5.0),
          PROXYCHAINS_SERVERS (rebuilds the whole file from `<file>.template`),
          TIMELAPSE_DT (whitelist: 1,2,3,4,5,6,10,15,20,30,60,120,180,240,360,1440
          or the form `1440+<n>` with n <= 1440). Out-of-range/invalid special
          values are silently dropped yet still return error=false.
        - As with get_configs, `conf` is interpolated into the file path and can
          enable path-traversal writes; `mqtt` maps to mqttv4.conf.
      parameters:
        - name: conf
          in: query
          required: false
          description: Target config file. `mqtt` writes mqttv4.conf. Same blocklist-only handling as getConfigs.
          schema:
            type: string
            enum:
              - camera
              - system
              - mqtt
              - mqtt_advertise
              - proxychains
              - ptz_presets
      requestBody:
        required: true
        description: Single-line JSON object mapping config KEY to value.
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
              description: Flat KEY->value map. See operation description for special keys.
      responses:
        "200":
          description: Always returned. `{"error":"true"}` on invalid query/body/key, else `{"error":"false"}` (even if individual writes no-op).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/status.json:
    get:
      operationId: getStatus
      tags:
        - Status
      summary: Get device status telemetry
      description: |-
        Returns a single JSON object of device telemetry. Read-only; a single
        unconditional code path with no error branch. All query parameters are
        silently ignored (no parsing). All values are quoted JSON strings.

        Quirks: `ptz` is `yes` only for an allowlist of model suffixes; `go2rtc`
        is `yes` only if the go2rtc binary exists; `free_sd` is the FREE percent
        (or `N/A`); `serial_number` can be empty. Values are interpolated raw with
        no escaping, so an exotic hostname/ESSID could break the JSON.
      responses:
        "200":
          description: Device telemetry (always).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusInfo'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/hostname.js:
    get:
      operationId: getHostname
      tags:
        - Status
      summary: Get hostname as a JavaScript snippet
      description: |-
        NOT JSON. Emits `text/javascript` loaded via a `script` tag; the body is
        a single statement `hostname="<value>";` that sets a global variable.
        The value is the contents of etc/hostname, unquoted in the command
        substitution and unescaped, so whitespace or a double-quote in the file
        corrupts the output. Read-only.
      responses:
        "200":
          description: A JavaScript assignment statement (always).
          content:
            text/javascript:
              schema:
                type: string
                example: hostname="yi-hack";
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/links.sh:
    get:
      operationId: getLinks
      tags:
        - Status
      summary: Get RTSP stream and snapshot URLs
      description: |-
        Returns stream and snapshot URLs derived from system.conf. Read-only; all
        query parameters are ignored.

        Which fields appear depends on config: the RTSP stream fields
        (low_res_stream, high_res_stream, audio_stream) are only present when RTSP
        is enabled and configured; audio_stream appears whenever RTSP_AUDIO is not
        exactly `no` and not exactly `none` (so an unset value still yields it).
        The two snapshot fields are always present. Note a port-suffix quirk: the
        default HTTPD_PORT (8080) is compared against "80", so snapshot URLs get
        `:8080` appended by default. Values are interpolated raw (no escaping).
      responses:
        "200":
          description: Stream/snapshot links (always). Stream fields are conditional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinksResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/proxy.sh:
    get:
      operationId: testProxy
      tags:
        - Network
      summary: Test outbound connectivity (optionally via proxychains)
      description: |-
        Makes an outbound `wget http://ipinfo.io` and splices the raw response
        into the `result` field. Only the FIRST query parameter is parsed and its
        key MUST be literally `proxy`; if not (including an empty query string)
        the response is `{"error":"true"}`.

        The value `1` routes the request through proxychains4; any other value
        (0, 2, empty) is NOT an error - a direct wget runs and success is returned.
        `result` is injected BARE/raw from ipinfo.io; if wget fails and the result
        is empty the body becomes malformed JSON. The whole query string is also
        gated by the validateQueryString blocklist.
      parameters:
        - name: proxy
          in: query
          required: true
          description: Must be the first parameter and keyed `proxy`. Value `1` = via proxychains4; any other value = direct.
          schema:
            type: string
            example: "1"
      responses:
        "200":
          description: Always returned. `result` present on success (raw ipinfo.io JSON), absent on the error paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/eventsdir.sh:
    get:
      operationId: getEventDirs
      tags:
        - Events
      summary: List motion-event recording directories
      description: |-
        Lists recording directories under `/tmp/sd/record` whose name contains
        `H` and is exactly 14 chars long (e.g. `2024Y08M24D15H`). Read-only; takes
        no parameters (query string is never read).

        Known bug: the record COUNT counts every `H`-matching entry but only
        14-char entries are emitted, so a non-14-char entry leaves a dangling
        trailing comma before `]}` -> malformed JSON. Parse defensively.
      responses:
        "200":
          description: List of event directories (always).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDirsResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/eventsfile.sh:
    get:
      operationId: getEventFiles
      tags:
        - Events
      summary: List recordings inside an event directory
      description: |-
        Lists the `.mp4` recordings inside one event directory. Read-only.

        The `dirname` value is only gated by the validateQueryString blocklist;
        the intended 14-char Y/M/D/H format check is DEAD CODE (spaced assignment
        bug), so the value is passed UNQUOTED into `ls -r /tmp/sd/record/$DIR` -
        enabling directory traversal (e.g. `dirname=../..`). If dirname is missing
        or the first key is not `dirname`, the response is `{"error":"true"}`. An
        empty value (`dirname=`) is accepted and lists the record ROOT.

        Known bug: a mismatch between the mp4 COUNT and the emitted entries can
        leave a dangling trailing comma -> malformed JSON.
      parameters:
        - name: dirname
          in: query
          required: true
          description: Event directory name (e.g. 2024Y08M24D15H). Format not enforced; empty value lists the record root.
          schema:
            type: string
      responses:
        "200":
          description: Recordings in the directory, or `{"error":"true"}` if dirname is missing/rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventFilesResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/eventsdirdel.sh:
    get:
      operationId: deleteEventDir
      tags:
        - Events
      summary: Delete an event directory (DESTRUCTIVE mutating GET)
      description: |-
        DESTRUCTIVE. Runs `rm -rf /tmp/sd/record/$DIR` with $DIR UNQUOTED. Despite
        being GET this deletes data - never prefetch.

        The special value `dir=all` expands $DIR to the glob `*` and deletes ALL
        recording directories. The 14-char format check is DEAD CODE, and the
        blocklist permits `/`, `.`, and space, so path traversal / argument
        splitting are possible.

        ALWAYS reports `{"error":"false"}` when the query-string gate passes -
        even when `dir` is missing/misnamed and nothing was deleted. The response
        cannot distinguish a successful delete from a no-op. A blocklisted char in
        the query string returns `{"error":"true"}`.
      parameters:
        - name: dir
          in: query
          required: false
          description: Directory to delete. `all` deletes every recording. Format not enforced; unquoted into rm -rf.
          schema:
            type: string
      responses:
        "200":
          description: Always `{"error":"false"}` on the pass path (even on no-op), `{"error":"true"}` on a blocklisted query string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/eventsfiledel.sh:
    get:
      operationId: deleteEventFile
      tags:
        - Events
      summary: Delete one recording and its thumbnail (DESTRUCTIVE mutating GET)
      description: |-
        DESTRUCTIVE. Removes `<base>.mp4` and `<base>.jpg` (same base) from
        /tmp/sd/record. Despite being GET this deletes data - never prefetch.

        The `file` value (a `<dirname>/<filename>` path) IS validated by a working
        validateRecFile: length must be exactly 27 or 29, with marker chars `Y` at
        index 4, `M` at 7, `D` at 10, `H` at 13, an `M` at index 17 or 19, and an
        `S` at index 20 or 22. A missing/misnamed param or a format failure returns
        `{"error":"true"}`. Success returns `{"error":"false"}` even if the files
        did not exist (`rm -f` never fails).
      parameters:
        - name: file
          in: query
          required: true
          description: The `<dirname>/<filename>` path, 27 or 29 chars with fixed Y/M/D/H/M/S marker positions.
          schema:
            type: string
      responses:
        "200":
          description: |-
            `{"error":"false"}` on success (even if files absent), `{"error":"true"}` on missing/invalid file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/snapshot.sh:
    get:
      operationId: getSnapshot
      tags:
        - Media
      summary: Capture a JPEG snapshot
      description: |-
        Captures a snapshot via the imggrabber binary. The response content type
        varies by parameters and all variants share HTTP 200:
        - default: raw binary JPEG (`image/jpeg`).
        - base64=yes: base64-encoded JPEG text under content type
          `image/jpeg;base64` (note: the body is ASCII base64, not binary).
        - a valid `file` param (resolving under /tmp/sd/record): writes the JPEG
          to disk and returns JSON `{"error":"false"}`.
        - a blocklisted query string: returns JSON `{"error":"true"}`.

        At most 4 query parameters are parsed (`for I in 1 2 3 4`); a 5th is
        discarded. res/watermark/base64 use nested tests with NO else branch, so
        out-of-domain values are silently dropped and the default is used. An
        invalid `file` (fails validateBaseName or does not resolve under
        /tmp/sd/record) is not an error - it falls through to the inline image.
      parameters:
        - name: res
          in: query
          required: false
          description: Resolution. Out-of-domain values silently fall back to `high`.
          schema:
            type: string
            enum:
              - low
              - high
            default: high
        - name: watermark
          in: query
          required: false
          description: Overlay the watermark. Out-of-domain values silently fall back to `no`.
          schema:
            $ref: '#/components/schemas/YesNo'
        - name: base64
          in: query
          required: false
          description: If `yes`, return base64 text under `image/jpeg;base64` instead of binary. Out-of-domain values fall back to `no`.
          schema:
            $ref: '#/components/schemas/YesNo'
        - name: file
          in: query
          required: false
          description: |-
            Optional bare filename to save the snapshot into /tmp/sd/record. Must
            pass validateBaseName (no leading `.`, no `/` or blocklisted chars). If
            valid, the response is JSON instead of an image; if invalid it is
            silently ignored (inline image returned).
          schema:
            type: string
      responses:
        "200":
          description: |-
            JPEG (binary or base64) on the image paths, or JSON on the save-to-disk
            and validation-failure paths. Content type indicates which.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
                description: Raw JPEG bytes (default and res/watermark paths).
            image/jpeg;base64:
              schema:
                type: string
                description: Base64-encoded JPEG text (base64=yes). ASCII, not binary.
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/record.sh:
    get:
      operationId: startRecording
      tags:
        - Media
      summary: Start an on-demand recording (mutating GET)
      description: |-
        Starts a recording of `time` seconds by running `ipc_cmd -S $TIME &`
        (backgrounded, fire-and-forget). Despite being GET this changes device
        state. Success JSON is emitted unconditionally, independent of whether
        ipc_cmd actually succeeds.

        Only the FIRST query parameter is parsed (`for I in 1`), so `time` must be
        first. `time` is validated by validateNumber (rejects empty or any char
        outside `0-9 . , -`); a failure returns `{"error":"true"}`. Omitted -> 60.
        No stock frontend caller.
      parameters:
        - name: time
          in: query
          required: false
          description: Recording length in seconds (must be first param). Defaults to 60. validateNumber charset only.
          schema:
            type: string
            default: "60"
      responses:
        "200":
          description: |-
            `{"error":"false"}` on success/default, `{"error":"true"}` on invalid query string or non-numeric time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/getlastrecordedvideo.sh:
    get:
      operationId: getLastRecordedVideo
      tags:
        - Media
      summary: Retrieve the most recent recording
      description: |-
        Returns the most recent recording in one of four forms selected by `type`.
        All non-error variants share HTTP 200 with differing content types:
        - type=1 (default) or any unrecognised type: `text/plain` relative path
          `DIRNAME/VIDEO.mp4`.
        - type=2: `text/plain` absolute URL
          `http://LOCAL_IP:HTTPD_PORT/record/DIRNAME/VIDEO.mp4`.
        - type=3: the raw mp4 (`video/mp4; charset=utf-8` - an unusual charset param
          on binary mp4, `Content-Disposition: inline`).
        - type=4: the raw mp4 (`video/mp4; charset=utf-8`, `Content-Disposition: attachment`).
        - blocklisted query string: JSON `{"error":"true"}` (the ONLY JSON path).

        At most 2 query params are parsed (`for I in 1 2`). `oldness` and `type`
        are NOT validated by validateNumber - only the whole-query blocklist
        applies; a non-numeric `oldness` triggers a `[: bad number` runtime error
        but the script continues on the default path.

        WARNING: `oldness < 0` makes the script WAIT for the next video, sleeping
        0.1s up to ~800 times - worst-case latency ~80 seconds. There is no JSON
        success path; a missing video yields an empty body under an already-sent
        video/mp4 header.
      parameters:
        - name: oldness
          in: query
          required: false
          description: |-
            0/1 = latest; >0 = Nth oldest in the current hour folder (clamped);
            <0 = wait for the next video (up to ~80s). Not numerically validated.
          schema:
            type: string
            default: "0"
        - name: type
          in: query
          required: false
          description: |-
            1=relative path (default), 2=absolute URL, 3=inline mp4, 4=attachment
            mp4. Any other value falls into the type=1 branch.
          schema:
            type: string
            enum:
              - "1"
              - "2"
              - "3"
              - "4"
            default: "1"
      responses:
        "200":
          description: |-
            Plain-text path/URL (type 1/2), raw mp4 (type 3/4), or JSON error on a
            blocklisted query string. Content type indicates which.
          content:
            text/plain:
              schema:
                type: string
                description: Relative path (type=1) or absolute URL (type=2).
            video/mp4:
              schema:
                type: string
                format: binary
                description: Raw mp4 bytes (type=3 inline / type=4 attachment).
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/timelapse.sh:
    get:
      operationId: timelapse
      tags:
        - Media
      summary: List or delete timelapse videos
      description: |-
        Two modes selected by `action`:
        - `action=list`: returns `{"error":"false","records":[...]}` of timelapse
          `.avi` files.
        - `action=delete`: requires a valid `file` (validateTLFile: length exactly
          23, `-` at indices 4,7,13,16, `_` at index 10, and `.avi` at 19-22; date
          and time digits are NOT checked). Deletes the file and returns
          `{"error":"false"}`; a missing/invalid file returns `{"error":"true"}`.

        WARNING: any other `action` (including the default `none`) produces a
        COMPLETELY EMPTY response with NO Content-type header. Error paths use
        `return` (not `exit`), which is a no-op at top level, so behavior after an
        error can be unusual. At most 2 query params are parsed. The list path
        shares the trailing-comma JSON bug (COUNT vs 23-char filter).
      parameters:
        - name: action
          in: query
          required: true
          description: Only `list` and `delete` produce output; any other value returns an empty body with no headers.
          schema:
            type: string
            enum:
              - list
              - delete
        - name: file
          in: query
          required: false
          description: Required for action=delete. 23-char `.avi` name with fixed separator positions (validateTLFile).
          schema:
            type: string
      responses:
        "200":
          description: |-
            For action=list, a records object; for action=delete, `{"error":...}`.
            For any other action the body is EMPTY with no Content-type header.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TimelapseListResponse'
                  - $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/ptz.sh:
    get:
      operationId: ptzMove
      tags:
        - PTZ
      summary: Move the pan/tilt/zoom motor (mutating GET)
      description: |-
        Drives the PTZ motor via ipc_cmd. Despite being GET this physically moves
        the lens. At most 5 query params are parsed (`for I in 1 2 3 4 5`).

        `action` (default `step`) selects the mode: `step` moves in `dir` for
        `time` seconds then stops; `cont` moves in `dir` with no stop; `abs`/`rel`
        move to/by `x,y`. An unknown action returns `{"error":"true"}`.

        `x`/`y`/`time` are validated by validateNumber and `dir` by validateString;
        ANY validator failure returns `{"error":"true"}` even for a param the
        chosen action never uses. `dir` is only charset-validated, never checked
        against a movement enum, and is passed UNQUOTED to ipc_cmd; a `_` splits it
        into two sequential moves (e.g. `up_left`). WARNING: `time` is an unbounded
        client-controlled `sleep` (DoS risk).
      parameters:
        - name: action
          in: query
          required: false
          description: Movement mode. Unknown values return error=true.
          schema:
            type: string
            enum:
              - step
              - abs
              - rel
              - cont
            default: step
        - name: x
          in: query
          required: false
          description: X target/delta for abs/rel. validateNumber (allows comma, so `1,2` is possible). Default 9999.
          schema:
            type: string
        - name: "y"
          in: query
          required: false
          description: Y target/delta for abs/rel. validateNumber. Default 9999.
          schema:
            type: string
        - name: dir
          in: query
          required: false
          description: |-
            Direction for step/cont. Stock values up|down|left|right|up_left|
            up_right|down_left|down_right|stop. Only charset-validated; a `_`
            triggers two sequential moves. Defaults to `none`: for action=step/cont
            with dir omitted or `none`, nothing moves but the response is still
            `{"error":"false"}`.
          schema:
            type: string
        - name: time
          in: query
          required: false
          description: Seconds to hold before stop (step only). validateNumber, UNBOUNDED. Default 0.3.
          schema:
            type: string
            default: "0.3"
      responses:
        "200":
          description: |-
            `{"error":"false"}` whenever the query validates - this does NOT imply an
            action was executed (action=step/cont with dir omitted or `none` moves
            nothing yet still returns error=false). `{"error":"true"}` on an unknown
            action or any validator failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/preset.sh:
    get:
      operationId: ptzPreset
      tags:
        - PTZ
      summary: Manage PTZ presets (mutating GET)
      description: |-
        Manages PTZ presets by invoking the external `ptz_presets.sh`. Despite
        being GET, add/delete/go mutate presets and move the lens. At most 3 query
        params are parsed.

        `action` is required. Stock values: `go_preset`, `add_preset`,
        `del_preset`. `none` (the default) and `get_presets` are explicitly refused
        with `{"error":"true","message":"-99"}` - presets are READ via
        `getConfigs?conf=ptz_presets`, not here. `action` has no dedicated
        per-parameter validator (the whole query string is still charset-filtered by
        validateQueryString) and is passed UNQUOTED to the external script.

        `num` must satisfy validateNumber OR be the literal `all` (used by
        delete-all); otherwise `{"error":"true","message":"Wrong arguments"}`.
        `name` must satisfy validateString (rejects `. , & ( )` among others), so
        free-text preset names with those chars are rejected. The stock UI POSTs
        add/del but the script ignores the body and reads only the query string.
      parameters:
        - name: action
          in: query
          required: true
          description: go_preset | add_preset | del_preset | set_home_position. `none`/`get_presets` are refused (message -99). set_home_position is supported by the backend but unused by the stock UI. Forwarded unquoted.
          schema:
            type: string
            enum:
              - go_preset
              - add_preset
              - del_preset
              - set_home_position
        - name: num
          in: query
          required: false
          description: Preset number, or the literal `all`. validateNumber otherwise. Omitted -> not passed.
          schema:
            type: string
        - name: name
          in: query
          required: false
          description: Preset name (validateString - rejects `. , & ( )` etc). Omitted -> not passed.
          schema:
            type: string
      responses:
        "200":
          description: |-
            `{"error":"false"}` when the external script succeeds (empty stdout),
            else `{"error":"true","message":"<msg>"}` (Invalid query, Wrong
            arguments, -99, or raw backend text). NOTE: multi-word backend messages
            (e.g. "Preset number out of range") are word-split across repeated printf
            format cycles, producing malformed JSON with extra unquoted-comma
            key/value pairs; `message` then holds only the first word.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/wifi.sh:
    post:
      operationId: wifi
      tags:
        - Network
      summary: Scan for Wi-Fi networks or save Wi-Fi credentials (mutating on save)
      description: |-
        ONE endpoint with two modes selected by the `action` query parameter. This
        is modelled as a single POST operation because the `save` mode needs a
        request body; note that in the firmware the `scan` mode is actually invoked
        as a GET with no body. The response schema is a oneOf of the two shapes.

        - `action=scan`: returns `{"wifi":[...]}` - an array of ESSID strings,
          ALWAYS terminated by an empty-string element `""` to absorb the trailing
          comma. SSIDs are injected raw/unescaped and are not guaranteed valid JSON.
        - `action=save` (mutating): reads a one-line JSON body with WIFI_ESSID,
          WIFI_PASSWORD, WIFI_PASSWORD2. If the JSON is valid and WIFI_PASSWORD ==
          WIFI_PASSWORD2, it writes the credentials, runs configure_wifi.sh (then
          `sleep 1`) and returns `{"error":"false"}`; invalid JSON or a password
          mismatch returns `{"error":"true"}`. Body values bypass all validators
          (only JSON validity is enforced).

        Only the FIRST `=`-delimited pair is parsed for `action`, so `action` must
        be the sole query parameter. Any action other than scan/save yields an
        EMPTY response with no headers.
      parameters:
        - name: action
          in: query
          required: true
          description: |-
            `scan` (invoked as GET in the firmware) or `save` (POST with body).
            Any other value returns an empty body with no headers.
          schema:
            type: string
            enum:
              - scan
              - save
      requestBody:
        required: false
        description: Required only for action=save. Single-line JSON object of Wi-Fi credentials.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WifiSaveRequest'
      responses:
        "200":
          description: |-
            For action=scan, `{"wifi":[...]}`; for action=save, `{"error":...}`. Any
            other action returns an empty body with no Content-type header.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WifiScanResponse'
                  - $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/speak.sh:
    post:
      operationId: speakText
      tags:
        - Audio
      summary: Speak text through the camera speaker (text-to-speech)
      description: |-
        Synthesises the POST body text via nanotts and plays it through the
        speaker. The body is read with `read -r` (first line only), is NOT
        validated, and is echoed unescaped into the response `description` (a `"`
        in the text breaks the JSON). Success path runs `sleep 1`.

        At most 2 query params are parsed. `lang` (default `en-US`) must pass
        validateLang: exactly 5 chars matching `[A-Za-z-]` (so `en_US` and `en`
        are rejected). Volume is set by either `vol` (linear, `pcmvol -g`) or
        `voldb` (dB, `pcmvol -G`); whichever is processed LAST wins (order
        matters). Both use validateNumber.

        Failure descriptions include "Invalid language", "Invalid volume",
        "Invalid volume (dB)", "Speaker busy", "TTS engine not found",
        "Audio input disabled". NOTE: the lang/vol/voldb validation-failure
        branches emit the JSON body WITHOUT a Content-type header.
      parameters:
        - name: lang
          in: query
          required: false
          description: BCP-47-ish 5-char code like `en-US` (validateLang - exactly 5 chars, `[A-Za-z-]`). Default en-US.
          schema:
            type: string
            default: en-US
        - name: vol
          in: query
          required: false
          description: Linear gain (pcmvol -g). Setting it forces linear mode. validateNumber. Default 1. Unused by stock UI.
          schema:
            type: string
        - name: voldb
          in: query
          required: false
          description: dB gain (pcmvol -G). Setting it forces dB mode. validateNumber. Default 0.
          schema:
            type: string
      requestBody:
        required: true
        description: UTF-8 text to speak (first line only is used).
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: |-
            `{"error":"false","description":"<text>"}` on success, else
            `{"error":"true","description":"<reason>"}`. Some failure paths omit the
            Content-type header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/speaker.sh:
    post:
      operationId: playAudio
      tags:
        - Audio
      summary: Play an uploaded audio clip through the speaker
      description: |-
        Plays an uploaded audio payload (multipart form field, or a raw PCM/WAV
        stream) through the speaker. If the data begins with a multipart boundary
        the wrapper is stripped heuristically; a leading `RIFF` (WAV header) has
        its first 4 bytes stripped. The body is not validated.

        Only the FIRST query param is parsed, so `vol` and `voldb` are mutually
        exclusive (whichever comes first wins); both use validateNumber. If the SD
        card is mounted, playback is BACKGROUNDED and success returns immediately
        (with empty description); if not mounted, playback is synchronous and the
        body must be <= 512000 bytes or the response is
        `{"error":"true","description":"File is too big"}`. Missing
        `/tmp/audio_in_fifo` returns "Audio input is not available". Worst-case
        blocking `sleep 1`. NOTE: the vol/voldb validateNumber failure branches emit
        the JSON body WITHOUT a Content-type header (only the query-string-blocklist
        and later branches include it).
      parameters:
        - name: vol
          in: query
          required: false
          description: Linear gain (pcmvol -g). Honoured only as the FIRST param. validateNumber. Default 1.
          schema:
            type: string
        - name: voldb
          in: query
          required: false
          description: dB gain (pcmvol -G). Honoured only as the FIRST param. validateNumber. Default 0.
          schema:
            type: string
      requestBody:
        required: true
        description: Audio payload - multipart/form-data file field or a raw PCM/WAV stream.
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The audio file (stock UI uses a FormData field named `file`).
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw PCM/WAV stream.
      responses:
        "200":
          description: |-
            `{"error":"false","description":""}` on success (mounted path returns
            before playback finishes), else `{"error":"true","description":"<reason>"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/speaker_file.sh:
    post:
      operationId: playAudioFile
      tags:
        - Audio
      summary: Play an existing audio file from /tmp/sd/audio
      description: |-
        Plays a pre-existing file from `/tmp/sd/audio/`. The POST body (first line
        only) is the FILENAME. WARNING: the filename is NOT validated and is used
        UNQUOTED, so path traversal (e.g. `../../etc/passwd`) is possible. Success
        runs `sleep 1`. No stock frontend caller.

        Only `voldb` is honoured (always dB via `pcmvol -G`); there is no linear
        option. KNOWN BUGS: the "File not found" and "Audio input disabled" JSON
        bodies are MALFORMED (missing the comma between `error` and `description`).
        Parse defensively. NOTE: the voldb validateNumber failure branch emits its
        JSON body WITHOUT a Content-type header (the header is printed only after
        that check).
      parameters:
        - name: voldb
          in: query
          required: false
          description: dB gain (pcmvol -G). validateNumber. Default 1.
          schema:
            type: string
      requestBody:
        required: true
        description: Filename relative to /tmp/sd/audio (first line only; unvalidated, path traversal possible).
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: |-
            `{"error":"false","description":"<filename>"}` on success, else an error
            object. The not-found and audio-disabled paths emit MALFORMED JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/fw_upgrade.sh:
    get:
      operationId: firmwareUpgrade
      tags:
        - Maintenance
      summary: Query firmware version or trigger a firmware upgrade (mutating GET)
      description: |-
        Two modes selected by the required `get` parameter (which must be the sole
        query param - the script does `cut -d'='` on the whole string).

        - `get=info`: returns JSON with fw_version, latest_fw (from a LIVE wget to
          the GitHub API - empty string if the network call fails), and `local_fw`
          as a BARE JSON boolean (the one place the API emits a real boolean).
        - `get=upgrade` (DESTRUCTIVE, mutating): returns `text/html` plain text on
          all sub-paths (e.g. "No SD detected.", "No space left on SD.", "No new
          firmware available.", "Unable to download firmware file.", "Download
          completed, rebooting and upgrading."). It runs `rm -rf` on four /tmp/sd
          paths BEFORE checking whether the download will succeed, then reboots.

        A blocklisted query string returns JSON `{"error":"true"}`. A missing/
        wrong `get` key, or a value outside {info,upgrade}, returns an EMPTY body
        with no Content-type header.
      parameters:
        - name: get
          in: query
          required: true
          description: |-
            `info` (JSON version info) or `upgrade` (destructive; text/html, then
            reboots). Must be the only query param. Other values -> empty 200.
          schema:
            type: string
            enum:
              - info
              - upgrade
      responses:
        "200":
          description: |-
            JSON version info for get=info; text/html status for get=upgrade; JSON
            error on a blocklisted query string; empty body for an unrecognised get.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FwInfoResponse'
            text/html:
              schema:
                type: string
                description: Plain-text status message for the upgrade path.
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/reboot.sh:
    get:
      operationId: reboot
      tags:
        - Maintenance
      summary: Reboot the camera (DESTRUCTIVE mutating GET)
      description: |-
        Reboots the camera. Takes no parameters and performs no validation. Returns
        `{"error":"false"}` FIRST, then runs `sync` x3, `killall mqttv4`,
        `sleep 1`, and `reboot`. Despite being GET this reboots the device - never
        prefetch or crawl.
      responses:
        "200":
          description: Always `{"error":"false"}`, sent just before the reboot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/reset.sh:
    get:
      operationId: resetConfig
      tags:
        - Maintenance
      summary: Factory-reset the configuration (DESTRUCTIVE mutating GET)
      description: |-
        Restores factory configuration: deletes hostname and the camera/mqttv4/
        proxychains/system conf files, then extracts `defaults.tar.bz2`. Takes no
        parameters and no validation. Does NOT reboot (the UI tells the user to
        reboot manually). Returns `{"error":"false"}` unconditionally AFTER the
        destructive ops, so a failed delete/extract still reports success. Despite
        being GET this wipes config - never prefetch or crawl.
      responses:
        "200":
          description: Always `{"error":"false"}`, even if the underlying rm/tar failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/save.sh:
    get:
      operationId: saveConfig
      tags:
        - Maintenance
      summary: Download a config backup archive
      description: |-
        Returns a bzip2-compressed tar (config.tar.bz2) of all etc/*.conf plus
        hostname. Read-only. Body is raw binary (application/octet-stream); the
        stock UI downloads it as a blob named config.tar.bz2.
      responses:
        "200":
          description: Binary bzip2 tar archive (always).
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/load.sh:
    post:
      operationId: loadConfig
      tags:
        - Maintenance
      summary: Upload and restore a config backup archive (mutating)
      description: |-
        Restores configuration from an uploaded `config.tar.bz2` (multipart field
        `files[]`). The archive MUST contain both system.conf and camera.conf.
        CONTENT_LENGTH must be <= 10000 bytes, or the script silently exits with an
        EMPTY body and no Content-type header.

        On success returns `text/html` "Upload completed successfully, restart your
        camera"; on failure "Upload failed". AFTER sending the response it applies
        live camera settings via ipc_cmd (worst-case `sleep 0.5` when CRUISE is
        presets/360). No validator is sourced; trust rests on the multipart parse
        and tar.
      requestBody:
        required: true
        description: Multipart upload of a config.tar.bz2 in the `files[]` field. Max 10000 bytes.
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                "files[]":
                  type: string
                  format: binary
                  description: The config.tar.bz2 archive (must contain system.conf and camera.conf).
      responses:
        "200":
          description: |-
            text/html "Upload completed successfully, restart your camera" or
            "Upload failed". An over-size upload returns an empty body.
          content:
            text/html:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'

  /cgi-bin/service.sh:
    get:
      operationId: controlService
      tags:
        - Maintenance
      summary: Start/stop/query a camera service (mutating for start/stop)
      description: |-
        Starts, stops, or queries a camera service by invoking the external
        service.sh. At most 4 query params are parsed. No stock frontend caller.

        - `action=status` with a matched `name` returns `{"status":"<RES>"}`, where
          RES (backend stdout) is injected RAW into the printf format string (not
          JSON-escaped). `all` is NOT a valid name for status.
        - `action=start` / `action=stop` (and every unmatched name/action) return
          `{}` - an empty object with no error and no status, so the client cannot
          tell success from a typo.
        - A blocklisted query string returns `{"error":"true"}`.

        `param1`/`param2` default to the literal string `none` and are forwarded
        positionally (unquoted) to the backend for rtsp/onvif/ftpd starts.
      parameters:
        - name: name
          in: query
          required: false
          description: |-
            Service name. start/stop: rtsp|onvif|wsdd|ftpd|mqtt|mqtt-config|
            mp4record|all. status: same set WITHOUT `all`. An unmatched name yields
            an empty `{}`.
          schema:
            type: string
            enum:
              - rtsp
              - onvif
              - wsdd
              - ftpd
              - mqtt
              - mqtt-config
              - mp4record
              - all
        - name: action
          in: query
          required: false
          description: start | stop | status. Any other value yields an empty `{}`.
          schema:
            type: string
            enum:
              - start
              - stop
              - status
        - name: param1
          in: query
          required: false
          description: Positional backend arg for rtsp/onvif/ftpd start. Defaults to the literal string `none`. Not individually validated.
          schema:
            type: string
        - name: param2
          in: query
          required: false
          description: Positional backend arg for rtsp/onvif start. Defaults to the literal string `none`. Not individually validated.
          schema:
            type: string
      responses:
        "200":
          description: |-
            `{"status":"..."}` for a matched status query, `{}` for start/stop and
            unmatched requests, `{"error":"true"}` for a blocklisted query string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |-
        BusyBox httpd HTTP Basic auth. Only enforced when a username/password is
        configured on the camera; otherwise all endpoints are unauthenticated.
  responses:
    Unauthorized:
      description: |-
        Returned by BusyBox httpd itself (NOT the CGI scripts) when HTTP Basic auth
        is enabled and the request is missing/invalid credentials.
  schemas:
    ErrorFlag:
      type: string
      enum:
        - "true"
        - "false"
      description: |-
        Failure flag. ALWAYS a quoted JSON string ("true"/"false"), never a JSON
        boolean. "true" means the request failed (still HTTP 200).
    YesNo:
      type: string
      enum:
        - "yes"
        - "no"
      description: |-
        On/off flag as the firmware represents it: the literal strings "yes"/"no".
        The firmware does NOT recognise true/1/on.
    SimpleResult:
      type: object
      description: The canonical result envelope shared by most endpoints.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorFlag'
    AudioResult:
      type: object
      description: Result envelope for the audio endpoints; description carries the spoken text, played filename, or an error reason.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorFlag'
        description:
          type: string
          description: Spoken text / played filename on success, or a human-readable failure reason. Unescaped; may corrupt the JSON.
    PresetResult:
      type: object
      description: Result envelope for ptzPreset; message is present only on failures.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorFlag'
        message:
          type: string
          description: |-
            Failure reason - "Invalid query", "Wrong arguments", "-99", or raw text
            from the backend script. A multi-word backend message is word-split
            across repeated printf format cycles, corrupting the JSON (extra
            unquoted-comma key/value pairs); `message` then holds only the first word.
    ServiceResult:
      type: object
      description: |-
        controlService response. A status query returns `status`; start/stop and
        unmatched requests return `{}`; a blocklisted query string returns `error`.
      properties:
        error:
          $ref: '#/components/schemas/ErrorFlag'
        status:
          type: string
          description: Backend service status text, injected raw (not JSON-escaped).
    ProxyResult:
      type: object
      description: testProxy response. `result` is the raw ipinfo.io JSON spliced in bare; absent on the error paths and possibly malformed if wget failed.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorFlag'
        result:
          type: object
          additionalProperties: true
          description: Raw JSON body returned by http://ipinfo.io, injected unescaped.
    FwInfoResponse:
      type: object
      description: firmwareUpgrade get=info response. Note local_fw is a BARE JSON boolean, unlike error which is a string.
      properties:
        error:
          $ref: '#/components/schemas/ErrorFlag'
        fw_version:
          type: string
          description: Installed firmware version.
        latest_fw:
          type: string
          description: Latest version from the GitHub API; empty string if the live network call failed.
        local_fw:
          type: boolean
          description: BARE JSON boolean (not a string) - true if a local firmware tgz is present.
    WifiScanResponse:
      type: object
      description: wifi action=scan response. The array is always padded with a trailing empty-string element; SSIDs are unescaped.
      required:
        - wifi
      properties:
        wifi:
          type: array
          items:
            type: string
          description: ESSID strings, always terminated by an empty-string "" element.
    WifiSaveRequest:
      type: object
      description: wifi action=save body. Values bypass all validators (only JSON validity is checked).
      properties:
        WIFI_ESSID:
          type: string
          description: Network SSID (stored as wifi_ssid).
        WIFI_PASSWORD:
          type: string
          description: Network passphrase (stored as wifi_psk).
        WIFI_PASSWORD2:
          type: string
          description: Passphrase confirmation - must equal WIFI_PASSWORD or the request fails. Never stored.
    StatusInfo:
      type: object
      description: Device telemetry from status.json. All values are strings except none - ptz/go2rtc use the yes/no strings.
      properties:
        name:
          type: string
        hostname:
          type: string
        fw_version:
          type: string
        home_version:
          type: string
        model_suffix:
          type: string
        ptz:
          $ref: '#/components/schemas/YesNo'
        go2rtc:
          $ref: '#/components/schemas/YesNo'
        serial_number:
          type: string
          description: May be an empty string.
        local_time:
          type: string
        uptime:
          type: string
        load_avg:
          type: string
        total_memory:
          type: string
        free_memory:
          type: string
        free_sd:
          type: string
          description: Free percent (e.g. "42%") or "N/A".
        local_ip:
          type: string
        netmask:
          type: string
        gateway:
          type: string
        mac_addr:
          type: string
        wlan_essid:
          type: string
        wlan_strength:
          type: string
    LinksResponse:
      type: object
      description: getLinks response. Stream fields are conditional on RTSP config; the two snapshot fields are always present.
      properties:
        low_res_stream:
          type: string
          description: RTSP URL for the low-resolution stream (conditional).
        high_res_stream:
          type: string
          description: RTSP URL for the high-resolution stream (conditional).
        audio_stream:
          type: string
          description: RTSP URL for the audio stream (present when RTSP is enabled AND RTSP_AUDIO is not exactly no/none).
        low_res_snapshot:
          type: string
          description: HTTP URL for a low-res snapshot (always present).
        high_res_snapshot:
          type: string
          description: HTTP URL for a high-res snapshot (always present).
    EventDirsResponse:
      type: object
      description: getEventDirs response. May be malformed (trailing comma) if a non-14-char entry exists.
      required:
        - records
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              datetime:
                type: string
                description: 'Human-readable label, e.g. "Date: 2024-08-24 Time: 15:00".'
              dirname:
                type: string
                description: Raw 14-char directory name, e.g. "2024Y08M24D15H".
    EventFilesResponse:
      type: object
      description: getEventFiles response on success. A missing/rejected dirname returns just {"error":"true"} instead.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorFlag'
        date:
          type: string
          description: YYYY-MM-DD derived from the directory name.
        records:
          type: array
          items:
            type: object
            properties:
              time:
                type: string
                description: 'e.g. "Time: 15:04".'
              filename:
                type: string
                description: Raw mp4 file name.
              thumbfilename:
                type: string
                description: Sibling .jpg thumbnail name, or empty string if none.
    TimelapseListResponse:
      type: object
      description: timelapse action=list response. May be malformed (trailing comma) if a non-23-char .avi exists.
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorFlag'
        records:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                description: 'e.g. "Date: 2024-08-24".'
              time:
                type: string
                description: 'e.g. "Time: 15:04:00".'
              filename:
                type: string
    GetConfigsResponse:
      type: object
      additionalProperties:
        type: string
      description: |-
        Generic getConfigs response: an open map of string values read from the
        chosen .conf file. ALWAYS includes a fake `"NULL":"NULL"` sentinel pair
        that clients MUST strip. OpenAPI 3.0 cannot select a per-conf schema by
        query value; see the named *Conf schemas for documented shapes.
    CameraConf:
      type: object
      description: |-
        Documentation-derived shape of the response for `getConfigs?conf=camera`.
        Not referenced by the operation (3.0 cannot switch schema on a query value).
        HOMEVER is appended by the script (raw/unescaped); the response also carries
        the "NULL":"NULL" sentinel which is omitted here.
      properties:
        SWITCH_ON:
          $ref: '#/components/schemas/YesNo'
        SAVE_VIDEO_ON_MOTION:
          $ref: '#/components/schemas/YesNo'
        MOTION_DETECTION:
          $ref: '#/components/schemas/YesNo'
        SENSITIVITY:
          type: string
          description: low | medium | high.
        AI_HUMAN_DETECTION:
          $ref: '#/components/schemas/YesNo'
        AI_VEHICLE_DETECTION:
          $ref: '#/components/schemas/YesNo'
        AI_ANIMAL_DETECTION:
          $ref: '#/components/schemas/YesNo'
        FACE_DETECTION:
          $ref: '#/components/schemas/YesNo'
        MOTION_TRACKING:
          $ref: '#/components/schemas/YesNo'
        SOUND_DETECTION:
          $ref: '#/components/schemas/YesNo'
        SOUND_SENSITIVITY:
          type: string
          description: Numeric string, e.g. "80".
        LED:
          $ref: '#/components/schemas/YesNo'
        ROTATE:
          $ref: '#/components/schemas/YesNo'
        IR:
          $ref: '#/components/schemas/YesNo'
        CRUISE:
          type: string
          description: no | presets | 360.
        HOMEVER:
          type: string
          description: Appended only for conf=camera; injected raw/unescaped.
    SystemConf:
      type: object
      description: |-
        Documentation-derived shape of the response for `getConfigs?conf=system`.
        Not referenced by the operation. HOSTNAME is appended by the script; the
        response also carries the "NULL":"NULL" sentinel which is omitted here.
      properties:
        HTTPD:
          $ref: '#/components/schemas/YesNo'
        TELNETD:
          $ref: '#/components/schemas/YesNo'
        SSHD:
          $ref: '#/components/schemas/YesNo'
        FTPD:
          $ref: '#/components/schemas/YesNo'
        BUSYBOX_FTPD:
          $ref: '#/components/schemas/YesNo'
        MDNSD:
          $ref: '#/components/schemas/YesNo'
        DISABLE_CLOUD:
          $ref: '#/components/schemas/YesNo'
        REC_WITHOUT_CLOUD:
          $ref: '#/components/schemas/YesNo'
        MQTT:
          $ref: '#/components/schemas/YesNo'
        RTSP:
          $ref: '#/components/schemas/YesNo'
        RTSP_ALT:
          type: string
        RTSP_STREAM:
          type: string
          description: high | low | both.
        RTSP_AUDIO:
          type: string
          description: yes | no | none.
        RTSP_STI:
          $ref: '#/components/schemas/YesNo'
        SPEAKER_AUDIO:
          $ref: '#/components/schemas/YesNo'
        SNAPSHOT:
          $ref: '#/components/schemas/YesNo'
        SNAPSHOT_VIDEO:
          $ref: '#/components/schemas/YesNo'
        SNAPSHOT_LOW:
          $ref: '#/components/schemas/YesNo'
        TIMELAPSE:
          $ref: '#/components/schemas/YesNo'
        TIMELAPSE_FTP:
          $ref: '#/components/schemas/YesNo'
        TIMELAPSE_FTP_SAME_NAME:
          $ref: '#/components/schemas/YesNo'
        TIMELAPSE_DT:
          type: string
        TIMELAPSE_VDT:
          type: string
        ONVIF:
          $ref: '#/components/schemas/YesNo'
        ONVIF_WSDD:
          $ref: '#/components/schemas/YesNo'
        ONVIF_PROFILE:
          type: string
        ONVIF_NETIF:
          type: string
        ONVIF_WM_SNAPSHOT:
          $ref: '#/components/schemas/YesNo'
        ONVIF_AUDIO_BC:
          type: string
        ONVIF_ENABLE_MEDIA2:
          $ref: '#/components/schemas/YesNo'
        ONVIF_FAULT_IF_UNKNOWN:
          $ref: '#/components/schemas/YesNo'
        ONVIF_FAULT_IF_SET:
          $ref: '#/components/schemas/YesNo'
        ONVIF_SYNOLOGY_NVR:
          $ref: '#/components/schemas/YesNo'
        TIME_OSD:
          $ref: '#/components/schemas/YesNo'
        NTPD:
          $ref: '#/components/schemas/YesNo'
        NTP_SERVER:
          type: string
        PROXYCHAINSNG:
          $ref: '#/components/schemas/YesNo'
        SWAP_FILE:
          $ref: '#/components/schemas/YesNo'
        SWAP_SWAPPINESS:
          type: string
        KERNEL_TUNING:
          $ref: '#/components/schemas/YesNo'
        RTSP_PORT:
          type: string
        HTTPD_PORT:
          type: string
        USERNAME:
          type: string
        PASSWORD:
          type: string
        TIMEZONE:
          type: string
        EVENTS_TIME:
          type: string
          description: autodetect | local | gmt.
        FREE_SPACE:
          type: string
        FTP_UPLOAD:
          $ref: '#/components/schemas/YesNo'
        FTP_HOST:
          type: string
        FTP_DIR:
          type: string
        FTP_DIR_TREE:
          $ref: '#/components/schemas/YesNo'
        FTP_USERNAME:
          type: string
        FTP_PASSWORD:
          type: string
        FTP_FILE_DELETE_AFTER_UPLOAD:
          $ref: '#/components/schemas/YesNo'
        SSH_PASSWORD:
          type: string
        CRONTAB:
          type: string
        DEBUG_LOG:
          $ref: '#/components/schemas/YesNo'
        STATIC_IP:
          type: string
        STATIC_MASK:
          type: string
        STATIC_GW:
          type: string
        STATIC_DNS1:
          type: string
        STATIC_DNS2:
          type: string
        CUSTOM_WATERMARK:
          $ref: '#/components/schemas/YesNo'
        HOSTNAME:
          type: string
          description: Appended only for conf=system.
    MqttConf:
      type: object
      description: Documentation-derived shape of `getConfigs?conf=mqtt` (reads mqttv4.conf). Not referenced by the operation. Omits the NULL sentinel.
      properties:
